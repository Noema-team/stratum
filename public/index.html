<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratum Developer Dashboard</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Persistent Navigation Bar -->
  <nav id="navbar">
    <div class="nav-left">
      <span class="logo">Stratum</span>
      <span id="project-title" class="badge secondary">Loading...</span>
    </div>
    
    <div class="nav-center">
      <a href="#overview" class="nav-tab active" id="tab-overview">Overview</a>
      <a href="#chat" class="nav-tab" id="tab-chat">Chat</a>
      <a href="#graph" class="nav-tab" id="tab-graph">Graph</a>
      <a href="#settings" class="nav-tab" id="tab-settings">Settings</a>
    </div>
    
    <div class="nav-right">
      <div id="connection-indicator">
        <span class="status-dot red"></span>
        <span class="status-text">Disconnected</span>
      </div>
      <div id="system-status-badge" class="badge default">unknown</div>
    </div>
  </nav>

  <!-- SPA Page View Mount Point -->
  <main id="page-content">
    <div class="loader-container">
      <div class="loader"></div>
      <p>Initializing Stratum Dashboard...</p>
    </div>
  </main>

  <!-- Interactive Gate Modal Overlays -->
  <div id="overlay-container" class="hidden"></div>

  <!-- Real-time Event Broadcaster Module -->
  <script type="module" src="index.js"></script>
</body>
</html>
