name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: verify
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log
      - name: show failure detail (diagnostic — temporary)
        if: steps.verify.outcome == 'failure'
        run: |
          echo "===== not ok summary ====="
          grep -n "not ok" /tmp/verify.log || echo "(no 'not ok' line found in captured output)"
          echo "===== not ok context (30 lines after each) ====="
          grep -A 30 "not ok" /tmp/verify.log || true
          exit 1
